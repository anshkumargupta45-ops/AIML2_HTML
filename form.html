<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <fieldset>
        <legend>Biodata</legend>
        <form action="./response.html">
            <label for="name">Username:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <br><br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass">
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob"> 
            <br><br>
            <label for="Gender">Gender:</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
            <br><br>
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb"><label for="hobb">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb"><label for="hobb">Football</label>
            <br><br>
            <label for="add">Addres:</label>
            <textarea name="add" id="add"></textarea>
            <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="attempt">Attempt:</label>
            <input type="number" name="attempt" id="attempt">
            <br><br>
            <label for="url">Homepage:</label>
            <input type="url" name="url" id="url">
            <br><br>
            <label for="file">Resume upload:</label>
            <input type="file" name="file" id="file">
            <br><br>
            <label for="lang">Select Language:</label>
            <select name="lang" id="lang">
                <option value="">select</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="HTML">HTML</option>
                <option value="Python">Python</option>
            </select>
            <br><br>
            <input type="submit">
            &nbsp;
            <input type="reset">
            <br><br>




        </form>
    </fieldset>
</body>

</html>
