<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text formaatting examle</title>
</head>
<body>
    <h1>Text Formatting Example</h1>
    <b>Bold Text</b>
    <br>
    <strong>Important text</strong>
    <br>
    <i>Italic text</i>
    <br>
    <em>Emphasized text</em>
    <br>
    <u>Underlined text</u>
    <br>
    <mark>Highlighted text</mark>
    <br>
    <small>Small text</small>
    <br>
    <p>H<sub>2</sub>O</p>
    <p>x<sup>2</sup></p>
    <br>
</body>
</html>
